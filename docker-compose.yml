services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sorisori
      POSTGRES_PASSWORD: sorisori
      POSTGRES_DB: sorisori
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorisori"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
