<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소리소리</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">

      <!-- 헤더 -->
      <header class="app-header">
        <div class="app-brand">
          <span class="brand-icon">🎙</span>
          <span class="brand-name">소리소리</span>
        </div>
        <div class="status-badge" id="status-badge">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">초기화 중...</span>
        </div>
      </header>

      <!-- 자막 영역 (메인) -->
      <section class="subtitle-panel">
        <div class="subtitle-scroll" id="subtitle-scroll">
          <div class="subtitle-placeholder" id="subtitle-placeholder">
            <p>캡처를 시작하면 한국어 자막이 여기에 표시됩니다.</p>
          </div>
          <div id="subtitle-list"></div>
        </div>

        <!-- 실시간 전사 중 표시 -->
        <div class="live-indicator" id="live-indicator" hidden>
          <span class="live-dot"></span>
          <span id="live-text"></span>
        </div>
      </section>

      <!-- 컨트롤 -->
      <footer class="control-bar">
        <div class="control-left">
          <label class="session-label" for="source-lang-select">언어</label>
          <select id="source-lang-select" class="lang-select">
            <option value="">자동 감지</option>
            <option value="en" selected>영어</option>
            <option value="ja">일본어</option>
            <option value="zh">중국어</option>
            <option value="ko">한국어</option>
          </select>
          <label class="session-label" for="session-id-input">세션</label>
          <input
            id="session-id-input"
            class="session-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="mvp-session-001"
          />
          <button id="reset-session-id-button" class="icon-button" title="기본값 복구">↩</button>
        </div>
        <div class="control-right">
          <button id="start-button" class="capture-button start">캡처 시작</button>
          <button id="stop-button" class="capture-button stop" disabled>캡처 중지</button>
        </div>
      </footer>

      <!-- 고급 정보 (접을 수 있음) -->
      <details class="debug-details">
        <summary>고급 정보 (개발자용)</summary>
        <div class="debug-grid">
          <div>
            <p class="debug-label">장치 진단</p>
            <pre id="snapshot-output" class="debug-pre">로드 중...</pre>
          </div>
          <div>
            <p class="debug-label">캡처 세션</p>
            <pre id="session-output" class="debug-pre">대기 중...</pre>
          </div>
          <div>
            <p class="debug-label">오디오 스트림</p>
            <pre id="metrics-output" class="debug-pre">대기 중...</pre>
          </div>
          <div>
            <p class="debug-label">게이트웨이</p>
            <pre id="gateway-output" class="debug-pre">대기 중...</pre>
          </div>
          <div>
            <p class="debug-label">사이드카 상태 / 로그</p>
            <pre id="sidecar-output" class="debug-pre">시작 중...</pre>
          </div>
        </div>
      </details>

    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
